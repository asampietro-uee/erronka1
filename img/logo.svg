<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" width="48" height="48" fill="none">
  <defs>
    <linearGradient id="logo-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#a855f7" />
      <stop offset="50%" stop-color="#7c3aed" />
      <stop offset="100%" stop-color="#ec4899" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  <!-- Magic Wand -->
  <path d="M10 38L28 20" stroke="#f1f5f9" stroke-width="3.5" stroke-linecap="round"/>
  <path d="M28 20L34 14" stroke="url(#logo-grad)" stroke-width="4" stroke-linecap="round"/>
  <!-- Wand Tip Star / Glow -->
  <polygon points="34,8 36,13 41,14 37,18 38,23 34,20 30,23 31,18 27,14 32,13" fill="url(#logo-grad)" filter="url(#glow)"/>
  <!-- Sparkles -->
  <circle cx="16" cy="14" r="2" fill="#e9d5ff" />
  <circle cx="22" cy="8" r="1.5" fill="#f472b6" />
  <circle cx="40" cy="28" r="2" fill="#c084fc" />
  <circle cx="12" cy="24" r="1.5" fill="#a855f7" />
</svg>
